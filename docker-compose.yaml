services:
  calculator-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculator-api:1.0
    environment:
      SERVER_PORT: "8081"
    expose:
      - "8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - calculator-network


  nginx:
    build: ./nginx
    image: calculator-nginx:1.0
    ports:
      - "80:80"
    depends_on:
      calculator-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calculator-network


networks:
  calculator-network:
    driver: bridge